name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the repository variable APP_URL (public app URL) before deploying."
            exit 1
          fi
          if [ -z "$CONTACT_EMAIL" ]; then
            echo "::error::Set the repository variable CONTACT_EMAIL before deploying."
            exit 1
          fi
          python3 scripts/build_site.py
        env:
          APP_NAME: ${{ vars.APP_NAME || 'Video Scheduler' }}
          APP_URL: ${{ vars.APP_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
