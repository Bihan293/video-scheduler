services:
  - type: web
    name: video-scheduler
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        sync: false
      - key: TIKTOK_SCOPES
        value: user.info.basic,video.upload,video.publish
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: DEMO_MODE
        value: "0"
      - key: MAX_UPLOAD_MB
        value: "500"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
